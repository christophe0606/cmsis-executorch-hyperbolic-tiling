#
# The application: a headless runner that loads the embedded .pte and runs one
# inference on the Ethos-U85. The AI layer (generated by create_ai_layer.py)
# brings the ExecuTorch runtime, the operator components and the model data;
# the Board layer brings the board bring-up.
project:
  packs:
    - pack: PyTorch::ExecuTorch@1.4.1
    - pack: ARM::CMSIS

  misc:
    - CPP:
        - -std=gnu++17
        - -Wno-deprecated-declarations
    - for-compiler: GCC
      C:
        - -Wno-psabi
      CPP:
        - -Wno-psabi
      Link:
        - -Wl,-u,_printf_float

  groups:
    - group: App
      # The CPU rasterizer is the frame-time reference for the NPU stages;
      # keep it optimized in the Debug build too.
      optimize: speed
      files:
        - file: ./src/app_main.cpp
        # EmbeddedModule: ExecuTorch's Module class without the POSIX file
        # loading, so it builds for bare metal (BSD-3-Clause, see
        # src/LICENSE-ExecuTorch).
        - file: ./src/arm_embedded_module.cpp
        - file: ./src/arm_embedded_module.hpp

    - group: MCP controls
      misc:
        - for-compiler: AC6
          CPP:
            - -ffp-mode=full
      files:
        - file: ./src/tiling_settings.cpp
        - file: ./src/tiling_settings.hpp
        - file: ./src/mcp_tools.cpp
        - file: ./src/mcp_tools.hpp

    - group: c_mcp
      misc:
        - for-compiler: AC6
          C:
            - -ffp-mode=full
      define:
        - CJSON_NESTING_LIMIT: 16
      files:
        - file: ./third_party/c_mcp/mcp.c
        - file: ./third_party/c_mcp/mcp.h
        - file: ./third_party/c_mcp/cJSON.c
        - file: ./third_party/c_mcp/cJSON.h

  layers:
    - layer: $Board-Layer$
      type: Board
    - layer: $AI-Layer$
      type: AI

  output:
    type:
      - elf
      - hex
      - map
