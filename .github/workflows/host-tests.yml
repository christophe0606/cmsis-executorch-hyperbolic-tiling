name: Host tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  cmcp:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        serial: ['ON', 'OFF']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cmake -S third_party/c_mcp -B build/cmcp -DCMCP_BUILD_TESTS=ON -DCMCP_BUILD_SERIAL=${{ matrix.serial }} -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build/cmcp --parallel
      - run: ctest --test-dir build/cmcp --output-on-failure
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/mcp/requirements-mcp-serial-bridge.txt
      - run: cmake -S tests -B build/host -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build/host --parallel
      - run: ctest --test-dir build/host --output-on-failure
      - run: python tests/test_mcp.py --server build/host/mcp_host -v
      - run: python tests/test_mcp_http.py -v
